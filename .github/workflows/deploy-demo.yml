# Rebuilds the Signet demo from a live run of the unmodified kernel and publishes it to
# GitHub Pages. Because the page is regenerated by `demos.build_demo` (which runs the real
# verifier + authorizers), the published URL is, by construction, a projection of the code at
# the deployed commit — not a hand-authored mockup.
#
# The demo is PINNED TO THE `demo` BRANCH on purpose: this workflow runs only on pushes to
# `demo`, so active development on `main` never changes the public demo. To refresh it, merge
# the kernel state you want to showcase into `demo` and push — that, and only that, redeploys.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy demo to Pages

on:
  push:
    branches: [demo]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The three demoed rails need only the core kernel deps (no xrpl/fastapi).
      - run: pip install pydantic pynacl pyyaml langgraph
      - run: python -m demos.build_demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4