[project]
name = "signet-runtime"
version = "0.1.0"
description = "Runtime enforcement layer for AP2-style agent payment mandates"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pynacl>=1.5",
    "xrpl-py>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["signet", "signet.authorizers"]
