[project]
name = "signet-runtime"
version = "0.1.0"
description = "Runtime enforcement layer for AP2-style agent payment mandates"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pynacl>=1.5",
    "pyyaml>=6",
]

[project.scripts]
signet = "signet.cli.main:main"

[project.optional-dependencies]
# Rail extras: the core install carries only the kernel + the local CLI gate.
# xrpl-py / fastapi are imported only by the modules that need them
# (signet/authorizers/xrpl_cosigner.py, signet/api.py) — never by `import signet`.
xrpl = ["xrpl-py>=4"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# The Supabase credential rail (the first keyholder slice): ES256 JWT minting/verification.
# Imported by signet/rails/supabase/* and the broker-bypass battery (tests/test_broker_supabase.py).
# `requests` is needed ONLY for opt-in live mode (SIGNET_SUPABASE_LIVE=1), imported lazily.
supabase = ["pyjwt[crypto]>=2.8", "cryptography>=41", "requests>=2.31"]
# hypothesis is OPTIONAL: the conformance battery enumerates its adversarial output space with zero
# deps; when hypothesis is present it ADDITIONALLY fuzzes random resolver outputs against the gate.
# The Supabase rail crypto rides in dev so the offline broker-bypass battery runs in the suite.
# xrpl-py rides in dev so the 21-attack spec (tests/test_attacks.py) runs on the documented install.
dev = ["pytest>=8", "hypothesis>=6", "pyjwt[crypto]>=2.8", "cryptography>=41", "xrpl-py>=4"]
# The AgentDojo egress-containment eval (evals/agentdojo/*, tests/test_egress_agentdojo.py).
# Heavy/academic dep, kept out of `dev`; the test SKIPS cleanly without it. Install to run the
# offline `--selftest` plumbing and the opt-in live paired run.
eval = ["agentdojo>=0.1.35"]
# The LIVE GitHub rail-bridge (L3 manual test) — outbound to api.github.com only.
# Not needed for the offline tests/demos; imported lazily by evals/github_railbridge/live_rail.py.
l3-github = ["pyjwt[crypto]>=2.8", "requests>=2.31"]
# The LangGraph refund-triage demo (examples/refund_triage/*). Needs langgraph for the StateGraph
# and the supabase rail crypto; the test module `pytest.importorskip("langgraph")` so the suite
# stays green without this extra. The `llm` resolver is gated behind SIGNET_REFUND_LLM=1 (no CI
# live calls).
refund-demo = ["langgraph>=0.2", "pyjwt[crypto]>=2.8", "cryptography>=41"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["signet", "signet.authorizers", "signet.cli", "signet.broker",
            "signet.rails", "signet.rails.supabase", "signet.rails.egress",
            "signet.sandbox"]
