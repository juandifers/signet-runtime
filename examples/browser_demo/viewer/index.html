<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signet · Live Enforcement</title>
<!--
  Signet LIVE enforcement sidebar (Spec 03) — a read-only panel that renders the browser
  demo's session in real time: the frozen ceiling, the scope menu with the ACTIVE lane lit,
  and each proposed action turning ALLOW-green or BLOCK-red as it happens.

  * READ-ONLY: it only fetches session.json (over http) and renders it. It writes nothing and
    the run behaves identically whether or not this panel is open.
  * Robust by design: it POLLS session.json every second. No socket, no reconnect logic. If a
    poll fails to fetch or parse (e.g. mid-write), it silently keeps the last good render and
    retries on the next tick — it never crashes or blanks out. (The writer is atomic, so torn
    reads shouldn't happen; this is belt-and-suspenders.)
  * Honest: the `tier 0 · advisory` badge is always shown — the panel never overclaims.
  Styling reuses the refund-triage viewer's tokens so it reads as the same project.
-->
<style>
  :root {
    --bg: #0f1419; --panel: #1a212b; --panel2: #131922; --line: #2a3441;
    --ink: #e6edf3; --muted: #8b98a8; --faint: #5d6b7d;
    --allow: #2ea043; --allow-bg: #0d2818; --allow-ink: #56d364;
    --block: #e5484d; --block-bg: #2b1316; --block-ink: #ff7b72;
    --escalate: #d29922; --escalate-bg: #2a2110; --escalate-ink: #e3b341;
    --accent: #2f81f7; --switch: #a371f7; --switch-bg: #1d1530; --switch-ink: #d2a8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 48px; }

  /* ---- header ---- */
  header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 16px; }
  .brand { font-size: 19px; font-weight: 800; letter-spacing: .3px; }
  .brand .dot { color: var(--accent); }
  .spacer { flex: 1 1 auto; }
  .who { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  .who b { color: var(--ink); }
  .tier { display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 800; letter-spacing: .3px; }
  .tier .pip { width: 9px; height: 9px; border-radius: 50%; }
  .tier.advisory { background: var(--escalate-bg); color: var(--escalate-ink); border: 1px solid var(--escalate); }
  .tier.advisory .pip { background: var(--escalate-ink); }
  .tier.structural { background: var(--allow-bg); color: var(--allow-ink); border: 1px solid var(--allow); }
  .tier.structural .pip { background: var(--allow-ink); }
  .live { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
  .live .beat { width: 8px; height: 8px; border-radius: 50%; background: var(--allow-ink);
    animation: beat 1s ease-in-out infinite; }
  .live.stale .beat { background: var(--faint); animation: none; }
  @keyframes beat { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  h2.sec { margin: 18px 2px 9px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); font-weight: 800; }

  /* ---- policy state ---- */
  .ceiling { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 12px; }
  .ceiling .lk { font-size: 12px; color: var(--faint); font-weight: 700; letter-spacing: .4px;
    text-transform: uppercase; margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
  .chip.dom { color: var(--ink); } .chip.act { color: var(--allow-ink); font-weight: 700; }

  .lanes { display: flex; gap: 10px; flex-wrap: wrap; }
  .lane { flex: 1 1 0; min-width: 150px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; opacity: .5; transition: opacity .25s, border-color .25s, box-shadow .25s; }
  .lane.active { opacity: 1; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 22px rgba(47,129,247,.18); }
  .lane .nm { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .lane .nm .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0; }
  .lane.active .nm .live-dot { opacity: 1; }
  .lane .meta { margin-top: 7px; font-size: 12px; color: var(--muted); line-height: 1.55; }
  .lane .meta .k { color: var(--faint); }

  /* ---- decision feed ---- */
  .feed { margin-top: 4px; }
  .fx { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 12px 14px 12px 18px; margin-bottom: 9px; overflow: hidden; }
  .fx::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
  .fx.allow::before { background: var(--allow); }
  .fx.block::before { background: var(--block); }
  .fx.switch::before { background: var(--switch); }
  .fx .top { display: flex; align-items: center; gap: 11px; }
  .seq { color: var(--faint); font-weight: 800; font-size: 13px; min-width: 24px; }
  .sbadge { font-size: 11px; font-weight: 800; letter-spacing: .3px; padding: 3px 8px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .act-tgt { flex: 1 1 auto; min-width: 0; }
  .act-tgt .act { font-size: 15px; font-weight: 800; }
  .act-tgt .tgt { font-size: 13px; color: var(--muted); margin-top: 1px; word-break: break-all; }
  .verdict { font-size: 15px; font-weight: 900; letter-spacing: 1px; padding: 5px 13px; border-radius: 8px; white-space: nowrap; }
  .verdict.allow { background: var(--allow-bg); color: var(--allow-ink); border: 1px solid var(--allow); }
  .verdict.block { background: var(--block-bg); color: var(--block-ink); border: 1px solid var(--block); }
  .verdict.switch { background: var(--switch-bg); color: var(--switch-ink); border: 1px solid var(--switch); }
  .reason { margin-top: 9px; font-size: 12.5px; color: var(--ink); line-height: 1.5; }
  .reason .lbl { color: var(--muted); }
  .rcpt { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; gap: 7px; align-items: center; }
  .rcpt .ok { color: var(--allow-ink); font-weight: 800; }
  .rcpt .bad { color: var(--block-ink); font-weight: 800; }
  .switchline { margin-top: 8px; font-size: 12px; color: var(--switch-ink); font-weight: 700; }

  @keyframes flash { from { background: rgba(47,129,247,.22); } to { background: var(--panel); } }
  .fx.fresh { animation: flash 1.1s ease-out; }

  .empty { color: var(--muted); text-align: center; padding: 44px 0; }
  footer { margin-top: 22px; color: var(--faint); font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">signet<span class="dot">.</span> <span style="font-weight:600">live enforcement</span></div>
    <div class="spacer"></div>
    <span id="live" class="live"><span class="beat"></span><span id="livetxt">connecting…</span></span>
    <span id="tier" class="tier advisory"><span class="pip"></span>tier 0 · advisory</span>
  </header>
  <div id="who" class="who"></div>

  <h2 class="sec">Frozen ceiling — the maximum authority, locked</h2>
  <div id="ceiling" class="ceiling"></div>

  <h2 class="sec">Scope menu — active lane is lit</h2>
  <div id="lanes" class="lanes"></div>

  <h2 class="sec">Decision feed — live</h2>
  <div id="feed" class="feed"><div class="empty">waiting for the run to start…</div></div>

  <footer>read-only · polls <span class="mono">session.json</span> every 1s · the run is unaffected whether this is open</footer>
</div>

<script>
(function () {
  "use strict";
  var SRC = "/session.json";             // served from the static-server root (http, not file://)
  var seen = {};                         // seq -> true, for the "fresh row" highlight
  var lastActive = null, lastGood = 0;

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function shortHash(h) { return h ? (String(h).slice(0, 10)) : "—"; }
  function vClass(d) { d = String(d || "").toUpperCase();
    return d === "ALLOW" ? "allow" : d === "BLOCK" ? "block" : "switch"; }

  function renderCeiling(c) {
    var box = document.getElementById("ceiling");
    box.innerHTML = "";
    box.appendChild(el("div", "lk", "🔒 frozen — cannot be widened at runtime"));
    var row = el("div", "row");
    (c.domains || []).forEach(function (d) { row.appendChild(el("span", "chip dom", d)); });
    (c.actions || []).forEach(function (a) { row.appendChild(el("span", "chip act", a)); });
    box.appendChild(row);
  }

  function renderLanes(scopes, active) {
    var box = document.getElementById("lanes");
    box.innerHTML = "";
    (scopes || []).forEach(function (s) {
      var lane = el("div", "lane" + (s.name === active ? " active" : ""));
      var nm = el("div", "nm");
      nm.appendChild(el("span", "live-dot"));
      nm.appendChild(document.createTextNode(s.name));
      lane.appendChild(nm);
      var meta = el("div", "meta");
      meta.appendChild(mkkv("domains", (s.domains || []).join(", ")));
      meta.appendChild(mkkv("actions", (s.actions || []).join(", ")));
      meta.appendChild(mkkv("clicks", s.click_policy || "—"));
      lane.appendChild(meta);
      box.appendChild(lane);
    });
  }
  function mkkv(k, v) {
    var d = el("div");
    d.appendChild(el("span", "k", k + ": "));
    d.appendChild(document.createTextNode(v));
    return d;
  }

  function renderFeed(effects) {
    var feed = document.getElementById("feed");
    if (!effects || !effects.length) {
      if (!feed.querySelector(".empty")) { feed.innerHTML = ""; feed.appendChild(el("div", "empty", "waiting for the run to start…")); }
      return;
    }
    if (feed.querySelector(".empty")) feed.innerHTML = "";
    effects.forEach(function (e) {
      if (seen[e.seq]) return;            // already rendered; rows are append-only by seq
      seen[e.seq] = true;
      var isSwitch = (e.rail === "scope") || (e.proposed && e.proposed.action === "select_scope");
      var vc = isSwitch ? "switch" : vClass(e.decision);
      var card = el("div", "fx " + vc + " fresh");

      var top = el("div", "top");
      top.appendChild(el("div", "seq", "#" + (e.seq != null ? e.seq : "")));
      top.appendChild(el("span", "sbadge", (e.active_scope || "—")));
      var at = el("div", "act-tgt");
      var pr = e.proposed || {};
      at.appendChild(el("div", "act", pr.action || ""));
      at.appendChild(el("div", "tgt", pr.target || ""));
      top.appendChild(at);
      top.appendChild(el("div", "verdict " + vc, isSwitch ? "SCOPE" : String(e.decision || "").toUpperCase()));
      card.appendChild(top);

      if (isSwitch) {
        var sw = el("div", "switchline");
        sw.textContent = (String(e.decision).toUpperCase() === "ALLOW")
          ? ("operator steered → active scope changed to “" + (e.active_scope || "?") + "”")
          : "operator request mapped to no scope → active scope unchanged";
        card.appendChild(sw);
      }
      if (e.reason) {
        var r = el("div", "reason");
        r.appendChild(el("span", "lbl", "reason: "));
        r.appendChild(document.createTextNode(e.reason));
        card.appendChild(r);
      }
      var rc = el("div", "rcpt");
      rc.appendChild(document.createTextNode("receipt "));
      var rid = el("b", "mono", shortHash(e.receipt_id));
      if (e.receipt_id) rid.title = e.receipt_id;
      rc.appendChild(rid);
      rc.appendChild(el("span", e.receipt_verified ? "ok" : "bad", e.receipt_verified ? "✓ signed" : "✗ unverified"));
      card.appendChild(rc);

      feed.appendChild(card);
    });
  }

  function render(data) {
    var m = data.mandate || {};
    document.getElementById("who").innerHTML =
      "<b>" + (m.principal || "agent") + "</b> · task " + (m.task_id || "—") +
      " · active scope <b>" + (m.active || "—") + "</b>";
    var tier = document.getElementById("tier");
    var structural = data.tier_structural === true;
    tier.className = "tier " + (structural ? "structural" : "advisory");
    tier.innerHTML = '<span class="pip"></span>' + (data.tier || (structural ? "structural" : "tier 0 · advisory"));
    if (m.ceiling) renderCeiling(m.ceiling);
    renderLanes(m.scopes, m.active);
    renderFeed(data.effects);
    lastActive = m.active;
  }

  function setLive(ok) {
    var live = document.getElementById("live");
    var txt = document.getElementById("livetxt");
    live.className = "live" + (ok ? "" : " stale");
    txt.textContent = ok ? "live" : "waiting…";
  }

  function poll() {
    fetch(SRC + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) { render(data); lastGood = Date.now(); setLive(true); })
      .catch(function () { setLive(Date.now() - lastGood < 4000); });  // keep last good render; retry next tick
  }
  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
